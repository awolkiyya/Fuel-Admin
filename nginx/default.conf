# =========================================================
# HTTP SERVER
# =========================================================

server {
    listen 80;
    listen [::]:80;

    server_name fuelstation.adamacity.gov.et;

    client_max_body_size 20M;

    # -----------------------------------------------------
    # Let's Encrypt ACME Challenge
    # IMPORTANT:
    # Keep this available for certificate renewal.
    # -----------------------------------------------------
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # -----------------------------------------------------
    # Redirect all other HTTP traffic to HTTPS
    # -----------------------------------------------------
    location / {
        return 301 https://fuelstation.adamacity.gov.et$request_uri;
    }
}


# =========================================================
# HTTP CATCH-ALL
# Prevent direct IP / unknown-host HTTP access
# =========================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    return 301 https://fuelstation.adamacity.gov.et$request_uri;
}


# =========================================================
# HTTPS SERVER
# =========================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name fuelstation.adamacity.gov.et;

    client_max_body_size 20M;


    # =====================================================
    # SSL / TLS
    # =====================================================

    ssl_certificate /etc/letsencrypt/live/fuelstation.adamacity.gov.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fuelstation.adamacity.gov.et/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;


    # =====================================================
    # SERVER INFORMATION DISCLOSURE
    # =====================================================

    server_tokens off;


    # =====================================================
    # SECURITY HEADERS
    # =====================================================

    # -----------------------------------------------------
    # HSTS
    # -----------------------------------------------------

    add_header Strict-Transport-Security \
        "max-age=31536000; includeSubDomains" always;


    # -----------------------------------------------------
    # MIME SNIFFING PROTECTION
    # -----------------------------------------------------

    add_header X-Content-Type-Options \
        "nosniff" always;


    # -----------------------------------------------------
    # CLICKJACKING PROTECTION
    # -----------------------------------------------------

    add_header X-Frame-Options \
        "SAMEORIGIN" always;


    # -----------------------------------------------------
    # REFERRER POLICY
    # -----------------------------------------------------

    add_header Referrer-Policy \
        "strict-origin-when-cross-origin" always;


    # -----------------------------------------------------
    # BROWSER PERMISSIONS
    # -----------------------------------------------------

    add_header Permissions-Policy \
        "camera=(), microphone=(), geolocation=(), payment=()" always;


    # -----------------------------------------------------
    # CROSS-ORIGIN OPENER POLICY
    # -----------------------------------------------------

    add_header Cross-Origin-Opener-Policy \
        "same-origin" always;


    # -----------------------------------------------------
    # CROSS-ORIGIN RESOURCE POLICY
    # -----------------------------------------------------

    add_header Cross-Origin-Resource-Policy \
        "same-origin" always;


    # -----------------------------------------------------
    # CROSS-ORIGIN EMBEDDER POLICY
    #
    # credentialless is generally less disruptive than
    # require-corp while still enabling COEP protection.
    # -----------------------------------------------------

    add_header Cross-Origin-Embedder-Policy \
        "credentialless" always;


    # -----------------------------------------------------
    # CONTENT SECURITY POLICY
    # -----------------------------------------------------
    #
    # Compatible with the current Next.js application.
    #
    # 'unsafe-inline' is retained because Next.js may use
    # inline scripts/styles during rendering/hydration.
    #
    # Future hardening:
    # Replace unsafe-inline with nonce/hash based CSP.
    # -----------------------------------------------------

    add_header Content-Security-Policy \
        "default-src 'self'; \
        script-src 'self' 'unsafe-inline'; \
        style-src 'self' 'unsafe-inline'; \
        img-src 'self' data: blob:; \
        font-src 'self' data:; \
        connect-src 'self' https: wss:; \
        object-src 'none'; \
        base-uri 'self'; \
        frame-ancestors 'self'; \
        form-action 'self';" always;


    # =====================================================
    # EXPRESS BACKEND
    # =====================================================

    location /api/ {

        proxy_pass http://196.190.216.31/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering off;


        # -------------------------------------------------
        # Hide backend technology information
        # -------------------------------------------------

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }


    # =====================================================
    # NEXT.JS STATIC FILES
    # =====================================================

    location /_next/static/ {

        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Static assets can be buffered.
        proxy_buffering on;


        # -------------------------------------------------
        # Hide Next.js technology information
        # -------------------------------------------------

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;


        # -------------------------------------------------
        # Immutable Next.js build assets
        # -------------------------------------------------

        add_header Cache-Control \
            "public, max-age=31536000, immutable" always;
    }


    # =====================================================
    # HEALTH CHECK
    # =====================================================

    location = /health {

        proxy_pass http://frontend:3000/health;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_buffering off;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        access_log off;


        # -------------------------------------------------
        # Never cache health endpoint
        # -------------------------------------------------

        add_header Cache-Control \
            "no-store, no-cache, must-revalidate, max-age=0" always;

        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }


    # =====================================================
    # NEXT.JS FRONTEND
    # =====================================================

    location / {

        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # -------------------------------------------------
        # WebSocket / Upgrade support
        # -------------------------------------------------

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering off;


        # -------------------------------------------------
        # Hide Next.js technology information
        # -------------------------------------------------

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
}