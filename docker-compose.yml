services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: frontend-app

    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Africa/Addis_Ababa

    expose:
      - "3000"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - frontend-network

  nginx:
    image: nginx:alpine

    container_name: frontend-nginx

    restart: unless-stopped

    depends_on:
      - frontend

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge